name: Isolated queue canary
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions: {}
jobs:
  canary-signal:
    name: canary-signal
    runs-on: ubuntu-24.04
    steps:
      - name: Deliberately reject merge group
        env:
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_SHA: ${{ github.sha }}
          PROBE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          printf 'event=%s sha=%s group_base=%s\n' "$PROBE_EVENT" "$PROBE_SHA" "$PROBE_GROUP_BASE"
          if [ "$PROBE_EVENT" = merge_group ]; then echo "intentional negative canary failure"; exit 1; fi
