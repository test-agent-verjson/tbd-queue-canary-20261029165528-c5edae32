name: isolated-supervisor-deadline-canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VerJSON/.github
          ref: fd988fb208421337fada43cb7619073e45b9ad10
          persist-credentials: false
      - name: Verify candidate and install pinned test dependencies
        run: |
          test "$(git rev-parse HEAD)" = fd988fb208421337fada43cb7619073e45b9ad10
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/deadline-venv"
          "$RUNNER_TEMP/deadline-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r scripts/actions-ci-python.requirements.txt
          echo "$RUNNER_TEMP/deadline-venv/bin" >> "$GITHUB_PATH"
      - name: Provision the exact canonical sandbox profile
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AZURE_CREDENTIALS: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          GOOGLE_APPLICATION_CREDENTIALS: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          document = yaml.safe_load(Path('.github/workflows/actions-ci.yml').read_text())
          steps = document['jobs']['hosted-compatibility-tests']['steps']
          found = [step['run'] for step in steps if step.get('name') == 'Provision trusted compatibility sandbox']
          if len(found) != 1 or '${{' in found[0]:
              raise SystemExit('canonical provisioner is missing or not portable')
          Path(os.environ['RUNNER_TEMP'], 'provision-sandbox.sh').write_text(found[0])
          PY
          bash "$RUNNER_TEMP/provision-sandbox.sh"
      - name: Exercise deadline on the provisioned profile
        env:
          VERJSON_TEST_REAL_BWRAP: '1'
        run: python3 -I scripts/ci-gate/ci-entry-receipts.test.py
