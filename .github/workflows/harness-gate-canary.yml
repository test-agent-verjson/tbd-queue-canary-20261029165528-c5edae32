name: Harness gate canary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VerJSON/.github
          ref: 0bf2e0ddf33b0b5532189e91cdcdd3c4fbfff9d1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install pinned test dependencies
        run: |
          python3 -I -m pip install --disable-pip-version-check --no-input --quiet --no-deps --only-binary=:all: --require-hashes --requirement scripts/actions-ci-python.requirements.txt
      - name: Exercise launch wrapper
        run: python3 scripts/ci-gate/ci-entry-receipts.test.py HarnessLaunchGateTests
