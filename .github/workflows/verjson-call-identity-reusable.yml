name: call identity reusable
on:
  workflow_call:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Print limited context
        env:
          CONTEXT_JOB: ${{ toJSON(job) }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          REUSABLE_JOB: ${{ github.job }}
        run: |
          printf 'caller_workflow=%s\nreusable_job=%s\njob_context=%s\n' "$CALLER_WORKFLOW" "$REUSABLE_JOB" "$CONTEXT_JOB"
