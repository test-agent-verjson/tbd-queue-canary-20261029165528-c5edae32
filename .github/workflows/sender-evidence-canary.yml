name: Sender evidence canary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VerJSON/.github
          ref: 4373384e5dde51193aeaa6505bb732db9b3a09d3
          persist-credentials: false
      - name: Run sender and lane evidence tests
        run: |
          python3 scripts/ci-gate/compatibility-lane-channel.test.py
          python3 scripts/ci-gate/compatibility-lane-evidence.test.py
